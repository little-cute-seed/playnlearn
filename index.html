<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Word & Math Game - Select Level</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #CBE6FF;
            background-image: radial-gradient(circle at 50% 50%, #E2F0FF 0%, #BFE0FF 100%);
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', cursive, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #2C3E50;
            font-size: 32px;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 0 2px 4px rgba(255,255,255,0.8);
        }

        /* Responsive Grid Layout */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            max-width: 1100px;
            width: 100%;
        }

        /* Interactive Card Styling */
        .game-card {
            background: #FFFFFF;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .game-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 35px rgba(0, 0, 0, 0.12);
        }

        /* Banner Header with Polka Dot Pattern */
        .card-header {
            height: 160px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(rgba(255, 255, 255, 0.4) 2px, transparent 2px);
            background-size: 16px 16px;
        }

        .card-icon {
            font-size: 64px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
        }

        .hot-badge {
            position: absolute;
            top: 14px;
            right: 16px;
            background-color: #FF5252;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 900;
            box-shadow: 0 3px 6px rgba(255, 82, 82, 0.4);
        }

        .card-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 22px;
            font-weight: 900;
            color: #1E293B;
            margin: 0 0 16px 0;
            line-height: 1.3;
        }

        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tag {
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 700;
        }

        .tag-blue { background-color: #EEF4FF; color: #4F46E5; }
        .tag-orange { background-color: #FFF6ED; color: #EA580C; }

        .card-desc {
            font-size: 13px;
            color: #64748B;
            line-height: 1.5;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <h1>🎮 選擇遊戲關卡 Choose a Game</h1>

    <div class="game-grid" id="gameGrid"></div>

    <script>
        function renderCards(games) {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';

            games.forEach(game => {
                const card = document.createElement('a');
                card.className = 'game-card';
                card.href = `./game.html?game=${game.game_id}`;

                const tagsHtml = game.tags ? game.tags.map((tag, idx) => 
                    `<span class="tag ${idx % 2 === 0 ? 'tag-blue' : 'tag-orange'}">${tag}</span>`
                ).join('') : '';

                card.innerHTML = `
                    <div class="card-header" style="background-color: ${game.themeColor || '#9C82FA'};">
                        ${game.isHot ? '<span class="hot-badge">Hot</span>' : ''}
                        <div class="card-icon">${game.icon || '🎮'}</div>
                    </div>
                    <div class="card-body">
                        <h2 class="card-title">${game.name}</h2>
                        <div class="tag-container">${tagsHtml}</div>
                        <div class="card-desc">${game.description || ''}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        fetch('./data.json')
            .then(res => {
                if (!res.ok) throw new Error("Failed to load data.json");
                return res.json();
            })
            .then(data => {
                const gamesList = Array.isArray(data) ? data : (data.games || []);
                renderCards(gamesList);
            })
            .catch(err => {
                console.warn("Fallback to inline menu data due to fetch error:", err);
                renderCards([
                    {
                        game_id: "color_train",
                        name: "🚂 顏色小火車",
                        icon: "🚂",
                        themeColor: "#fbdc8d",
                        isHot: true,
                        tags: ["Color", "English"],
                        description: "Drag the correct color word into the blank to build your train!"
                    }
                ]);
            });
    </script>
</body>
</html>
