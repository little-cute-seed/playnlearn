<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play & Learn</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', cursive, sans-serif;
            background: #E2F0FF;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .home-btn {
            background: #ffffff;
            color: #1E293B;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: transform 0.1s ease;
        }

        .home-btn:active {
            transform: scale(0.95);
        }

        .game-card {
            background: #FFFFFF;
            padding: 30px;
            border-radius: 28px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .image-display {
            font-size: 80px;
            margin-bottom: 10px;
        }

        .hint-text {
            font-size: 18px;
            color: #64748B;
            margin-bottom: 5px;
            font-style: italic;
        }

        .prompt-text {
            font-size: 32px;
            font-weight: 900;
            color: #1E293B;
            margin: 10px 0 30px 0;
            line-height: 1.3;
        }

        .options-grid {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .option-btn {
            background: #EEF4FF;
            color: #4F46E5;
            border: 3px solid #818CF8;
            font-size: 22px;
            font-weight: bold;
            padding: 16px 28px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.15);
            transition: all 0.15s ease;
        }

        .option-btn:hover {
            background: #4F46E5;
            color: #FFFFFF;
            transform: translateY(-2px);
        }

        .option-btn:active {
            transform: scale(0.95);
        }

        .progress-text {
            margin-top: 25px;
            font-size: 14px;
            color: #64748B;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="./index.html" class="home-btn">⬅️ Home</a>
        <h2 id="game-title" style="color: #2C3E50; margin: 0;">Loading...</h2>
    </div>

    <div class="game-card">
        <div id="image-display" class="image-display"></div>
        <div id="hint-text" class="hint-text"></div>
        <div id="prompt-text" class="prompt-text"></div>
        <div id="options-container" class="options-grid"></div>
        <div id="progress" class="progress-text"></div>
    </div>

    <script>
        let currentQuestions = [];
        let currentIndex = 0;

        const urlParams = new URLSearchParams(window.location.search);
        const selectedGameId = parseInt(urlParams.get('game')) || 1;

        fetch('./data.json')
            .then(res => {
                if (!res.ok) throw new Error("Could not find data.json");
                return res.json();
            })
            .then(data => {
                const gameData = data.games.find(g => g.game_id === selectedGameId);

                if (!gameData) {
                    document.getElementById('game-title').innerText = "Game Not Found";
                    return;
                }

                document.getElementById('game-title').innerText = gameData.name;
                currentQuestions = gameData.questions;
                currentIndex = 0;
                renderQuestion();
            })
            .catch(err => {
                console.error("Path Error:", err);
                document.getElementById('game-title').innerText = "Error Loading Game";
            });

        function renderQuestion() {
            if (currentIndex >= currentQuestions.length) {
                document.getElementById('image-display').innerText = "🎉";
                document.getElementById('hint-text').innerText = "";
                document.getElementById('prompt-text').innerText = "Level Complete!";
                document.getElementById('options-container').innerHTML = `
                    <a href="./index.html" class="home-btn" style="font-size: 20px; padding: 12px 24px;">Play Again</a>
                `;
                document.getElementById('progress').innerText = "";
                return;
            }

            const q = currentQuestions[currentIndex];
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            let correctAnswer;

            if (q.sequence) {
                // Game 3 Math logic
                document.getElementById('image-display').innerText = "🚀";
                document.getElementById('hint-text').innerText = "";
                document.getElementById('prompt-text').innerText = q.sequence.join(" ");
                correctAnswer = q.answer;
            } else {
                // Game 1 & 2 English logic
                document.getElementById('image-display').innerText = q.image || "";
                document.getElementById('hint-text').innerText = q.hint || "";
                document.getElementById('prompt-text').innerText = q.sentence || q.word || "";
                correctAnswer = q.word;
            }

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, correctAnswer);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('progress').innerText = `Question ${currentIndex + 1} of ${currentQuestions.length}`;
        }

        function checkAnswer(selected, correct) {
            if (String(selected) === String(correct)) {
                currentIndex++;
                renderQuestion();
            } else {
                alert("❌ Try again!");
            }
        }
    </script>
</body>
</html>
